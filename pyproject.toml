[project]
name = "harry-translate-v2-mac"
version = "0.1.0"
description = "HARRY Translate V2 Apple Silicon Mac realtime translation"
requires-python = ">=3.12,<3.13"
dependencies = [
    "certifi==2026.11.20",
    "fastapi==0.165.0",
    "pydantic==2.14.4",
    "python-dotenv==1.2.4",
    "sounddevice==0.5.6",
    "uvicorn==0.54.0",
    "websocket-client==1.9.2",
    "websockets==17.4",
]

[dependency-groups]
dev = [
    "pip-audit==2.10.1",
    "pyinstaller==6.16.0",
    "pytest==9.2.0",
    "ruff==0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = [".venv", ".venv-*", ".tmp", "legacy", "docs/workflows"]

[tool.ruff.lint]
select = ["B", "E", "F"]
ignore = ["E501"]
